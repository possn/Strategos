name: Strategos quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax:
    name: Runtime JavaScript syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
  invariants:
    name: Architecture invariants
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:invariants
  webkit:
    name: Browser E2E / WebKit iPhone
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-review
          path: artifacts/*.png
          if-no-files-found: ignore

